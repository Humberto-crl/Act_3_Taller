<div class="productos">

    <h2>Lista de Productos</h2>

    <div
        class="producto"
        *ngFor="let producto of productos">
        <h3>{{ producto.nombre }}</h3>

        <p>
            Precio:
            {{ producto.precio | currency:'GTQ':'symbol':'1.2-2' }}
        </p>

        <button
            type="button"
            (click)="agregar(producto)">

         Agregar al carrito

        </button>

    </div>

</div>
